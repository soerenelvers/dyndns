# In einen vorhandenen HTTPS-server-Block übernehmen.
# TLS-Zertifikat und server_name über die vorhandene Serververwaltung einrichten.
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Eingehende Forwarding-Header überschreiben, niemals vom Client übernehmen.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    client_max_body_size 8k;
}
