# Im vorhandenen HTTPS-VirtualHost verwenden.
# Benötigte Module: proxy, proxy_http, headers (sudo a2enmod ...).
# server_name/ServerName und TLS-Zertifikat separat einrichten.
ProxyPreserveHost On
ProxyAddHeaders Off
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
ProxyPass / http://127.0.0.1:3000/ connectiontimeout=5 timeout=60
ProxyPassReverse / http://127.0.0.1:3000/
LimitRequestBody 8192
